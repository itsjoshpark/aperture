name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a branch supersedes an in-flight run, but never cancel main —
# a cancelled run there would leave the deploy half-done.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default, so the write scopes `deploy` needs read as the deliberate
# escalation they are rather than as whatever the repository happens to grant.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Format, lint, typecheck
        run: pnpm check

      - name: Test
        run: pnpm test run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - name: Build
        run: pnpm build

      # The invariants in AGENTS.md that nothing else can see: the in-memory fake
      # staying out of the entry graph, and `base` still being `/aperture/`.
      - name: Check the bundle
        run: pnpm check:bundle

      # Runs here rather than in the e2e job because this is where `dist` already
      # exists — the alternative is building it twice.
      - name: Smoke-test the built app
        run: pnpm e2e:production

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run Playwright
        run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Deploy is gated: it only runs on main, and only once both checks are green.
  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
