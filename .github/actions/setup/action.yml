name: Setup
description: Node, pnpm, dependencies and the Chromium both test suites drive.

# Both jobs need the identical five steps: the `browser` Vitest project runs in
# real Chromium, so it is not only the Playwright job that has to install one.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Cache Playwright browsers
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Chromium
      run: pnpm exec playwright install --with-deps chromium
      shell: bash
