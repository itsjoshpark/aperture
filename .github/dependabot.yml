version: 2

updates:
  # Actions float on major tags, so patch and minor fixes arrive on their own and
  # what is left for Dependabot is the major bumps — which are the ones that
  # would otherwise sit unnoticed until a tag is retired and CI stops running.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The toolchain is pinned through a pnpm `catalog:` entry with a
      # hand-maintained `minimumReleaseAgeExclude` list beside it in
      # pnpm-workspace.yaml. Dependabot does not know about either, so a bump
      # here would break the pin and leave the exclusions naming a version
      # nothing installs. Upgrading Vite+ stays a deliberate, manual step.
      - dependency-name: vite
      - dependency-name: vite-plus
      - dependency-name: "@voidzero-dev/*"
